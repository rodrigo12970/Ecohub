<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con EcoNet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: url("https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?w=1920");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #14532d;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    header {
      padding: 18px 25px;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4em; }
    .logo { color: #7ee787; }
    .back {
      color: #7ee787;
      text-decoration: none;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .bot {
      background: rgba(255,255,255,0.15);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .user {
      background: #7ee787;
      color: #0b3d2e;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      padding: 15px 20px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 25px;
      border: none;
      font-size: 1em;
    }
    .input-area button {
      padding: 13px 22px;
      border-radius: 25px;
      border: none;
      background: #7ee787;
      color: #0b3d2e;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:hover { background: #a5f3b0; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <header>
    <h1><span class="logo">Eco</span>Net Chat</h1>
    <a class="back" href="index.html">← Volver</a>
  </header>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">¡Hola! Soy EcoNet 🌱. Pregúntame sobre árboles, ecología, el clima... o escribe "buscar" seguido de algo para abrirlo en Ecosia.</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    function addMsg(text, who) {
      var box = document.getElementById("chatBox");
      var div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function botReply(text) {
      var lower = text.toLowerCase();

      // Buscar en Ecosia
      if (lower.indexOf("buscar") === 0) {
        var query = text.substring(7).trim();
        if (query) {
          window.open("https://www.ecosia.org/search?q=" + encodeURIComponent(query), "_blank");
          return "He abierto la búsqueda de \"" + query + "\" en Ecosia 🌍";
        }
        return "Escribe \"buscar\" seguido de lo que quieras, por ejemplo: buscar árboles.";
      }

      // Saludos
      if (lower.indexOf("hola") !== -1 || lower.indexOf("buenas") !== -1 || lower.indexOf("hey") !== -1)
        return "¡Hola! 🌱 ¿En qué te ayudo hoy?";
      if (lower.indexOf("buenos días") !== -1 || lower.indexOf("buenos dias") !== -1)
        return "¡Buenos días! ☀️ Espero que tengas un gran día. ¿Te ayudo en algo?";
      if (lower.indexOf("buenas noches") !== -1)
        return "¡Buenas noches! 🌙 Descansa bien. ¡Hasta mañana!";

      // Quién eres
      if (lower.indexOf("quién eres") !== -1 || lower.indexOf("quien eres") !== -1 || lower.indexOf("qué eres") !== -1 || lower.indexOf("que eres") !== -1)
        return "Soy EcoNet 🌱, tu buscador ecológico. Ayudo a encontrar información y a cuidar el planeta. ¿Qué quieres saber?";

      // Árboles y ecología
      if (lower.indexOf("árbol") !== -1 || lower.indexOf("arbol") !== -1 || lower.indexOf("plantar") !== -1)
        return "¡Los árboles son increíbles! 🌳 Absorben CO2, dan oxígeno y son el hogar de millones de especies. Cada búsqueda en Ecosia ayuda a plantarlos. ¿Quieres saber cómo plantar uno?";
      if (lower.indexOf("reciclar") !== -1)
        return "¡Reciclar es clave! ♻️ Separa papel, plástico, vidrio y orgánico. Reciclar una lata de aluminio ahorra energía para 3 horas de TV. ¿Quieres más consejos?";
      if (lower.indexOf("plástico") !== -1 || lower.indexOf("plastico") !== -1)
        return "El plástico tarda cientos de años en descomponerse. 🌊 Reduce su uso con botellas reutilizables y bolsas de tela. ¡Cada pequeño gesto cuenta!";
      if (lower.indexOf("cambio climático") !== -1 || lower.indexOf("cambio climatico") !== -1 || lower.indexOf("calentamiento") !== -1)
        return "El cambio climático es el mayor reto de nuestro tiempo 🌡️. Se debe sobre todo a los gases de efecto invernadero. Podemos ayudar ahorrando energía, reciclando y plantando árboles.";
      if (lower.indexOf("agua") !== -1)
        return "El agua es vida 💧. Cierra el grifo, dúchate en menos tiempo y reutiliza el agua siempre que puedas. ¡Cada gota cuenta!";
      if (lower.indexOf("energía") !== -1 || lower.indexOf("energia") !== -1)
        return "Ahorra energía 💡 apagando luces, usando bombillas LED y desenchufando aparatos. La energía solar y eólica son el futuro. ¿Quieres saber más?";
      if (lower.indexOf("animal") !== -1)
        return "¡Los animales son maravillosos! 🐾 Muchas especies están en peligro por la deforestación. Plantar árboles y cuidar los bosques les da un hogar.";

      // Definiciones y cultura general
      if (lower.indexOf("qué es") !== -1 || lower.indexOf("que es") !== -1 || lower.indexOf("definir") !== -1)
        return "Buena pregunta 🤔. Escríbeme \"buscar\" seguido del término (ej: buscar fotosíntesis) y te lo explico con fuentes en Ecosia.";

      // Estado de ánimo
      if (lower.indexOf("bien") !== -1 && (lower.indexOf("cómo estás") !== -1 || lower.indexOf("como estas") !== -1))
        return "¡Estoy genial, gracias por preguntar! 🌱 Y tú, ¿cómo estás?";
      if (lower.indexOf("cómo estás") !== -1 || lower.indexOf("como estas") !== -1 || lower.indexOf("qué tal") !== -1 || lower.indexOf("que tal") !== -1)
        return "¡Muy bien, gracias! 🌿 ¿Y tú qué tal? Cuéntame, ¿en qué te ayudo?";
      if (lower.indexOf("gracias") !== -1 || lower.indexOf("graciass") !== -1)
        return "¡De nada! 🌿 Aquí estoy para lo que necesites. ¡Cuida del planeta!";
      if (lower.indexOf("te quiero") !== -1)
        return "¡Yo también te aprecio! 🌱 Cuidemos juntos el planeta. 💚";

      // Despedidas
      if (lower.indexOf("adiós") !== -1 || lower.indexOf("adios") !== -1 || lower.indexOf("hasta luego") !== -1 || lower.indexOf("nos vemos") !== -1)
        return "¡Hasta pronto! 🌲 Cuida de ti y del planeta. ¡Vuelve cuando quieras!";

      // Chistes y diversión
      if (lower.indexOf("chiste") !== -1)
        return "¿Por qué los árboles no usan internet? ¡Porque no tienen ramas... de red! 🌳😂 ¿Quieres otro?";
      if (lower.indexOf("juego") !== -1 || lower.indexOf("aburrido") !== -1)
        return "¿Aburrido? Prueba a escribirme \"buscar\" + algo curioso, como: buscar datos curiosos sobre la naturaleza. ¡Te sorprenderás! 🎲";

      // Respuesta por defecto
      return "Interesante 🤔. No tengo una respuesta preparada para eso, pero escríbeme \"buscar\" seguido de tu tema (ej: buscar fotosíntesis) y te lo abro en Ecosia con fuentes de verdad.";
    }

    function sendMessage() {
      var input = document.getElementById("userInput");
      var text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";
      setTimeout(function() {
        addMsg(botReply(text), "bot");
      }, 500);
    }

    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
