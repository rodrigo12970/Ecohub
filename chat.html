<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con EcoNet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #14532d;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    header {
      padding: 18px 25px;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4em; }
    .logo { color: #7ee787; }
    .back {
      color: #7ee787;
      text-decoration: none;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .bot {
      background: rgba(255,255,255,0.15);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .user {
      background: #7ee787;
      color: #0b3d2e;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      padding: 15px 20px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 25px;
      border: none;
      font-size: 1em;
    }
    .input-area button {
      padding: 13px 22px;
      border-radius: 25px;
      border: none;
      background: #7ee787;
      color: #0b3d2e;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:hover { background: #a5f3b0; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <header>
    <h1><span class="logo">Eco</span>Net Chat</h1>
    <a class="back" href="index.html">← Volver</a>
  </header>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">¡Hola! Soy EcoNet 🌱. Pregúntame sobre plantar árboles o escribe "buscar" seguido de algo para abrir una búsqueda en Ecosia.</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    // FONDO DEL CHAT: montañas y atardecer (diferente a la portada)
    var imagenesChat = [
      "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80",
      "https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?w=1920&q=80",
      "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=1920&q=80",
      "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=1920&q=80",
      "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1920&q=80",
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80"
    ];
    var diaChat = new Date().getDate();
    var indiceChat = diaChat % imagenesChat.length;
    document.body.style.backgroundImage = "url('" + imagenesChat[indiceChat] + "')";

    function addMsg(text, who) {
      var box = document.getElementById("chatBox");
      var div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function botReply(text) {
      var lower = text.toLowerCase();

      if (lower.indexOf("buscar") === 0) {
        var query = text.substring(7).trim();
        if (query) {
          window.open("https://www.ecosia.org/search?q=" + encodeURIComponent(query), "_blank");
          return "He abierto la búsqueda de \"" + query + "\" en Ecosia 🌍";
        }
        return "Escribe \"buscar\" seguido de lo que quieras, por ejemplo: buscar árboles.";
      }

      if (lower.indexOf("hola") !== -1) return "¡Hola! 🌱 ¿En qué te ayudo?";
      if (lower.indexOf("árbol") !== -1 || lower.indexOf("arbol") !== -1) return "¡Los árboles son lo mejor! 🌳 Cada búsqueda en Ecosia ayuda a plantarlos.";
      if (lower.indexOf("gracias") !== -1) return "¡De nada! 🌿 Aquí estoy para lo que necesites.";
      if (lower.indexOf("quién eres") !== -1 || lower.indexOf("quien eres") !== -1) return "Soy EcoNet, tu buscador ecológico 🌱. Ayudo a encontrar información y a cuidar el planeta.";
      if (lower.indexOf("adiós") !== -1 || lower.indexOf("adios") !== -1) return "¡Hasta pronto! 🌲 Cuida de ti y del planeta.";

      return "Buena pregunta 🤔. Prueba a escribir \"buscar\" seguido de tu tema (ej: buscar cambio climático) y te lo abro en Ecosia.";
    }

    function sendMessage() {
      var input = document.getElementById("userInput");
      var text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";
      setTimeout(function() {
        addMsg(botReply(text), "bot");
      }, 500);
    }

    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
