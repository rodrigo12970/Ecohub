<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNet — Busca y planta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b3d2e, #14532d);
      color: white;
      text-align: center;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 3em; margin-bottom: 5px; }
    .logo { color: #7ee787; }
    form { display: flex; gap: 10px; margin-top: 20px; }
    input {
      padding: 14px 20px;
      width: 400px;
      border-radius: 30px;
      border: none;
      font-size: 1em;
    }
    button {
      padding: 14px 25px;
      border-radius: 30px;
      border: none;
      background: #7ee787;
      color: #0b3d2e;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover { background: #a5f3b0; }
    .hint { margin-top: 15px; font-size: 0.9em; opacity: 0.8; }
  </style>
</head>
<body>
  <h1><span class="logo">Eco</span>Net</h1>
  <p>Busca y planta árboles 🌱</p>
  <form action="https://www.ecosia.org/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="Escribe tu búsqueda..." required>
    <button type="submit">Buscar</button>
  </form>
  <p class="hint">Tus búsquedas se abren en Ecosia, que planta árboles con la publicidad.</p>
</body>
</html>
