<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNet — Busca y planta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0b3d2e;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    h1 { font-size: 3.2em; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }
    .logo { color: #7ee787; }
    p.tagline { font-size: 1.2em; margin-bottom: 25px; text-shadow: 1px 1px 6px rgba(0,0,0,0.7); }

    form { display: flex; gap: 10px; }
    input {
      padding: 15px 22px;
      width: 420px;
      border-radius: 30px;
      border: none;
      font-size: 1em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button {
      padding: 15px 28px;
      border-radius: 30px;
      border: none;
      background: #7ee787;
      color: #0b3d2e;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button:hover { background: #a5f3b0; }

    .chat-btn {
      margin-top: 20px;
      background: transparent;
      border: 2px solid #7ee787;
      color: #7ee787;
    }
    .chat-btn:hover { background: #7ee787; color: #0b3d2e; }

    .hint { margin-top: 18px; font-size: 0.9em; opacity: 0.9; text-shadow: 1px 1px 5px rgba(0,0,0,0.7); }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <h1><span class="logo">Eco</span>Net</h1>
  <p class="tagline">Busca y planta árboles 🌱</p>
  <form action="https://www.ecosia.org/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="Escribe tu búsqueda..." required>
    <button type="submit">Buscar</button>
  </form>
  <a href="chat.html"><button class="chat-btn" type="button">💬 Chatea con EcoNet</button></a>
  <p class="hint">Tu fondo cambia cada día con imágenes de naturaleza.</p>

  <script>
    // FONDO DE LA PORTADA: bosque y naturaleza (cambia cada día)
    var imagenes = [
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80",
      "https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=1920&q=80",
      "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&q=80",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80",
      "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=1920&q=80",
      "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?w=1920&q=80",
      "https://images.unsplash.com/photo-1440342359743-84fcb8c21f21?w=1920&q=80"
    ];
    var dia = new Date().getDate();
    var indice = dia % imagenes.length;
    document.body.style.backgroundImage = "url('" + imagenes[indice] + "')";
  </script>
</body>
</html>
